<!--
  A marca do Maxx News, na aba do navegador.

  É a MESMA do canto da sidebar (`.spk-marca`): quadrado de canto arredondado,
  gradiente do ouro (`--crimson` #F5B800 → mistura 55% com `--uv` champanhe
  = #F5C63E), "S" no preto do fundo do app. Mesmo desenho da Central e do
  Mailing, com a cor deste app — quem tem as abas abertas distingue pela cor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5B800"/>
      <stop offset="1" stop-color="#F5C63E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <text x="32" y="33" fill="#000000"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="800" letter-spacing="-1"
        text-anchor="middle" dominant-baseline="central">S</text>
</svg>
